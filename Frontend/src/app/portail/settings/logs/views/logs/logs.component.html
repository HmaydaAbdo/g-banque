<div class=" p-fluid">
  <div class="flex justify-content-between align-items-center">
    <p-breadcrumb [model]="items" [style]="{'background-color': 'transparent', 'border': 'none'}" >
      <ng-template pTemplate="item" let-item>
        @if (item.route) {
          <a [routerLink]="item.route" class="p-menuitem-link" routerLinkActive="active-breadcrumb" #rla="routerLinkActive">
            <span [ngClass]="[item.icon ? item.icon : '', 'text-color', 'text-2xl']"></span>
            <span class="text-black-alpha-90 p-2 font-bold">{{ item.label }}</span>
          </a>
        } @else {
          <a [href]="item.url">
            <span class="text-color text-sm  md:text-xl lg:text-2xl text-center">{{ item.label }}</span>
          </a>
        }
      </ng-template>
    </p-breadcrumb>
  </div>

  <div class="pg-filters">
    <span class="pg-filters__label"><i class="pi pi-sliders-h" aria-hidden="true"></i> Filtres</span>
    <form class="flex flex-wrap gap-3 align-items-end">

      <div class="flex flex-column gap-2" style="min-width: 200px;">
        <label for="userName">Nom d'utilisateur</label>
        <p-dropdown
          id="userName"
          [options]="usernames"
          [(ngModel)]="searchCriteria.userName"
          name="userName"
          placeholder="Sélectionner un utilisateur"
          [showClear]="true"
          (onChange)="onFilterChange()"
          [filter]="true"
          filterPlaceholder="Rechercher...">
          <ng-template let-option pTemplate="item">
            <span>{{ option }}</span>
          </ng-template>
        </p-dropdown>
      </div>

      <div class="flex flex-column gap-2" style="min-width: 200px;">
        <label for="operationType">Type d'Opération</label>
        <p-dropdown id="operationType" [options]="operationTypes" [(ngModel)]="searchCriteria.operationType" name="operationType" placeholder="Sélectionner un type" [showClear]="true" (onChange)="onFilterChange()"></p-dropdown>
      </div>

      <div class="flex flex-column gap-2" style="min-width: 200px;">
        <label for="entityName">Nom de l'Entité</label>
        <p-dropdown
          id="entityName"
          [options]="entityNames"
          [(ngModel)]="searchCriteria.entityName"
          name="entityName"
          placeholder="Sélectionner une entité"
          [showClear]="true"
          (onChange)="onFilterChange()"
          [filter]="true"
          filterPlaceholder="Rechercher..."
        >
          <ng-template let-option pTemplate="item">
            <span>{{ option }}</span>
          </ng-template>
        </p-dropdown>
      </div>

      <div class="flex flex-column gap-2" style="min-width: 170px;">
        <label for="timestampStart">Date de début</label>
        <p-calendar
          id="timestampStart"
          [(ngModel)]="searchCriteria.timestampStart"
          name="timestampStart"
          [showTime]="true"
          dateFormat="dd/mm/yy"
          [showIcon]="true"
          placeholder="Depuis..."
          [showClear]="true"
          (onSelect)="onFilterChange()"
          (onClearClick)="onFilterChange()">
        </p-calendar>
      </div>

      <div class="flex flex-column gap-2" style="min-width: 170px;">
        <label for="timestampEnd">Date de fin</label>
        <p-calendar
          id="timestampEnd"
          [(ngModel)]="searchCriteria.timestampEnd"
          name="timestampEnd"
          [showTime]="true"
          dateFormat="dd/mm/yy"
          [showIcon]="true"
          placeholder="Jusqu'à..."
          [showClear]="true"
          (onSelect)="onFilterChange()"
          (onClearClick)="onFilterChange()">
        </p-calendar>
      </div>

      <div class="flex-shrink-0">
        <p-button icon="pi pi-times" severity="secondary"
                  (onClick)="clearFilters()" [style]="{'white-space': 'nowrap'}">
        </p-button>
      </div>

    </form>
  </div>
  <p-table
    [value]="logs"
    [lazy]="true" [sortField]="'id'" [sortOrder]="-1"
    (onLazyLoad)="loadLogs($event)"
    [paginator]="true"
    [rows]="10"
    [totalRecords]="totalRecords"
    [loading]="loading"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Affichage de {first} à {last} sur {totalRecords} logs"
    [rowsPerPageOptions]="[10, 25, 50]"
    [resizableColumns]="true"
    [scrollable]="true"
    scrollHeight="600px"
    styleClass="p-datatable-gridlines"
  >
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="userName">Utilisateur <p-sortIcon field="userName"></p-sortIcon></th>
        <th pSortableColumn="operationType">Opération <p-sortIcon field="operationType"></p-sortIcon></th>
        <th pSortableColumn="entityName">Entité <p-sortIcon field="entityName"></p-sortIcon></th>
        <th pSortableColumn="entityId">ID Entité <p-sortIcon field="entityId"></p-sortIcon></th>
        <th pSortableColumn="timestamp">Date <p-sortIcon field="timestamp"></p-sortIcon></th>
        <th style="width: 100px;">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-log>
      <tr (click)="showLogDetails(log)" class="cursor-pointer">
        <td>{{ log.userName }}</td>
        <td>{{ log.operationType }}</td>
        <td>{{ log.entityName }}</td>
        <td>{{ log.entityId }}</td>
        <td>{{ log.timestamp | date:'medium' }}</td>
        <td>
          <button pButton pRipple icon="pi pi-trash" class="p-button-rounded p-button-danger " (click)="deleteLog(log); $event.stopPropagation()" pTooltip="Supprimer le Log" tooltipPosition="bottom"></button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="7" class="text-center">Aucun log trouvé.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
