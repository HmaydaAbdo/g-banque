<div class="h-screen w-screen overflow-y-scroll flex flex-column justify-content-center align-items-center p-4">

  <h2 class="mb-4 text-color">Trésorerie Globale Actuelle</h2>

  <div *ngIf="loading" class="text-center text-color-secondary mt-4">
    Chargement de la trésorerie...
  </div>

  <div *ngIf="errorMessage" class="p-error-message text-center text-red-500 mt-4">
    {{ errorMessage }}
  </div>

  <div *ngIf="currentGlobalTreasury !== undefined && !loading && !errorMessage"
       class="p-card p-4 shadow-5 border-round-md bg-white-alpha-90 max-w-25rem w-full text-center">
    <div class="text-3xl font-bold mb-3 text-color-secondary">Solde Consolidé:</div>
    <div class="text-3xl font-bold text-green-600">
      {{ currentGlobalTreasury  }} MAD
    </div>
    <p class="text-sm text-color-secondary mt-3">
      Ce montant représente la somme des soldes actuels de tous vos comptes bancaires.
    </p>
  </div>

  <div *ngIf="!loading && !errorMessage && currentGlobalTreasury === undefined"
       class="p-4 text-center text-color-secondary">
    Impossible de déterminer la trésorerie globale.
  </div>
</div>
