


<div class="h-screen w-screen overflow-y-scroll flex flex-column justify-content-center align-items-center">
  <div class=" flex flex-wrap   gap-4 p-4  ">
    <div class="flex flex-column">
      <label for="bankDropdown" class="mb-2 text-color-secondary">Sélectionner une Banque:</label>
      <p-dropdown id="bankDropdown"
                  [options]="banks"
                  [(ngModel)]="selectedBank"
                  optionLabel="name"
                  placeholder="Sélectionner une banque"
                  (onChange)="onSelectionChange()"
                  [showClear]="true"
                  styleClass="w-20rem">
      </p-dropdown>
    </div>

    <div class="flex flex-column">
      <label for="natureDropdown" class="mb-2 text-color-secondary">Sélectionner la Nature:</label>
      <p-dropdown id="natureDropdown"
                  [options]="naturesLigneFonctionnelle"
                  [(ngModel)]="selectedNatureLigneFonctionnelle"
                  optionLabel="label"
                  placeholder="Sélectionner une nature"
                  (onChange)="onSelectionChange()"
                  [showClear]="false"
                  styleClass="w-20rem">
      </p-dropdown>
    </div>

    <div class="flex flex-column">
      <label for="chkTaux" class="mb-2 text-color-secondary">Afficher Taux</label>
      <div class="flex align-items-center justify-content-center h-full">
        <p-checkbox [(ngModel)]="showTaux" [binary]="true" inputId="chkTaux" (onChange)="updateChartDatasets()"></p-checkbox>
      </div>
    </div>

    <div class="flex flex-column">
      <label for="chkPlafond" class="mb-2 text-color-secondary">Afficher Plafond</label>
      <div class="flex align-items-center justify-content-center h-full">
        <p-checkbox [(ngModel)]="showPlafond" [binary]="true" inputId="chkPlafond" (onChange)="updateChartDatasets()"></p-checkbox>
      </div>
    </div>
  </div>

  <h5 *ngIf="!historicalChartData || (historicalChartData.labels.length === 0 && historicalChartData.datasets.length === 0)"
      class="text-center text-color mt-4">
    {{ historicalChartTitle }}
  </h5>

  <p-chart *ngIf="historicalChartData && (historicalChartData.labels.length > 0 || historicalChartData.datasets.length > 0)"
           type="line"
           [data]="historicalChartData"
           [options]="historicalChartOptions"
           class="w-full h-30rem">
  </p-chart>

  <div *ngIf="historicalChartData && historicalChartData.datasets.length === 0 && (showTaux || showPlafond) && historicalChartData.labels.length > 0"
       class="p-4 text-center text-color-secondary">
    Veuillez sélectionner au moins "Taux" ou "Plafond" à afficher.
  </div>

  <div *ngIf="historicalChartData && historicalChartData.labels.length === 0 && (showTaux || showPlafond)"
       class="p-4 text-center text-color-secondary">
    Aucune donnée historique disponible pour la banque et la nature de ligne sélectionnées.
  </div>
</div>
