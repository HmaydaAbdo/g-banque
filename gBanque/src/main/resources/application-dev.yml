server:
#  address: 0.0.0.0
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/GBanque?useSSL=false&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  batch:
    job:
      enabled: true
    jdbc:
      initialize-schema: always


  mail:
    host: localhost
    port: 1025
    username: ''
    password: ''
    from: no-reply@Gbanque.com
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
