<div class="p-fluid p-4">
  <div class="p-field flex flex-column align-items-center">
    <h3>Sélectionner une banque pour afficher ses encours</h3>
  </div>

  <div *ngIf="loading" class="p-field text-center">
    <p>Chargement des banques...</p>
  </div>

  <div *ngIf="errorMessage" class="p-field text-center text-red-500">
    <p>{{ errorMessage }}</p>
  </div>

  <div class="p-field mt-4 flex flex-column align-items-center">
    <label for="bankSelect" class="p-mb-2">Banque</label>
    <p-dropdown
      id="bankSelect"
      [options]="banks"
      [(ngModel)]="selectedBank"
      optionLabel="nom"
      placeholder="Sélectionnez une banque"
      class="w-full md:w-16rem"
      [showClear]="true"
      [filter]="true"
    ></p-dropdown>
  </div>

  <div class="p-field mt-4 flex flex-column align-items-center">
    <p-button
      label="Afficher les encours"
      icon="pi pi-chart-bar"
      (onClick)="navigateToEncours()"
      [disabled]="!selectedBank"
      styleClass="p-button-primary w-full md:w-16rem"
    ></p-button>
  </div>
</div>
