<div class="flex flex-column h-30rem min-w-30rem max-w-50rem border-round-md surface-border overflow-hidden">


  <div class="flex-grow-1 overflow-y-auto" (scroll)="onScroll($event)">
    <div class="p-3">
      <ng-container *ngIf="notifications.length > 0; else noNotifications">
        <div *ngFor="let notification of notifications"
             class="surface-card shadow-1 border-round-md p-3 mb-3 cursor-pointer
                    hover:bg-blue-50 transition-colors transition-duration-150
                    border-1 border-solid surface-border"
             [ngClass]="{'border-left-5 border-blue-500': !notification.readStatus}"
             (click)="confirmNotificationAction(notification)"> <!-- Changed click handler -->
          <div class="flex align-items-center mb-2">
            <i class="pi pi-bell mr-2" [ngClass]="{'text-blue-500': notification.type === 'INFO',
                                                 'text-orange-500': notification.type === 'WARNING',
                                                 'text-red-500': notification.type === 'ALERT',
                                                 'text-green-500': notification.type === 'SUCCESS'}"></i>
            <span class=" text-sm  ">{{ notification.title }}</span>
            <p-tag [value]="notification.type" [severity]="getSeverity(notification.type)" class="ml-auto"></p-tag>
          </div>
          <p class="text-color-secondary text-sm mb-2">{{ notification.content }}</p>
          <div class="text-xs text-500 text-right">
            {{ notification.timestamp }}
          </div>
        </div>
      </ng-container>

      <ng-template #noNotifications>
        <div class="flex flex-column align-items-center justify-content-center p-5 text-center text-color-secondary">
          <i class="pi pi-inbox text-4xl mb-3"></i>
          <p class="text-lg">Aucune nouvelle notification.</p>
        </div>
      </ng-template>

      <!-- Loading Skeleton -->
      <div *ngIf="isLoading" class="p-3">
        <div class="mb-3">
          <p-skeleton width="100%" height="2rem" styleClass="mb-2"></p-skeleton>
          <p-skeleton width="75%" height="1rem"></p-skeleton>
        </div>
        <div class="mb-3">
          <p-skeleton width="100%" height="2rem" styleClass="mb-2"></p-skeleton>
          <p-skeleton width="75%" height="1rem"></p-skeleton>
        </div>
      </div>
    </div>
  </div>

  <!-- Confirmation Dialog for Notification Details -->
  <p-confirmDialog key="notificationConfirm"></p-confirmDialog>
</div>
