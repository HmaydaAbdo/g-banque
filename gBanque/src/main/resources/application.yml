server:
  servlet:
    contextPath: /gBanque/api

spring:
  application:
    name: gBanque

  datasource:
    url: jdbc:mysql://localhost:3306/GBanque?useSSL=false&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  batch:
    job:
      enabled: true
    jdbc:
      initialize-schema: always


functional:
  line:
    expiration:
      alert:
        threshold:
          months: 2
      warning:
        threshold:
          months: 3

logging:
  level:
    # Essential for seeing the request URL and headers
    org.springframework.web.reactive.function.client: DEBUG
    # Essential for seeing connection details (e.g., to which IP/port it actually connects)
    reactor.netty.http.client: DEBUG
  #file:
    #path: C:/Users/Hp/Desktop/n8n/logs/gBanque.log

application-start-date: 2025-08-22T00:00:00+00:00
