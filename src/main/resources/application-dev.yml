# =============================================================================
# G-Banque — Profil DEV
# Activé quand SPRING_PROFILES_ACTIVE=dev (défaut)
# =============================================================================

management:
  endpoints:
    web:
      exposure:
        # Dev : tous les endpoints Actuator disponibles
        include: health,info,metrics,prometheus,loggers,env,threaddump,heapdump,scheduledtasks,liquibase,flyway
  endpoint:
    health:
      show-details: always   # Détails santé visibles sans authentification en dev

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/gbanque?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update   # Hibernate crée/modifie le schéma automatiquement en dev
    show-sql: false       # Passer à true localement si besoin de déboguer les requêtes
  batch:
    jdbc:
      initialize-schema: always   # Recrée les tables Spring Batch au démarrage

logging:
  level:
    root: INFO
    staport.finance.gBanque: DEBUG
    org.springframework.web: INFO
    # Décommentez ces lignes si vous avez un bug sur vos entités ou vos calculs :
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
