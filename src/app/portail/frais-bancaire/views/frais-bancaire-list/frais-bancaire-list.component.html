<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="card flex flex-column gap-2 p-2 w-screen h-screen overflow-y-scroll">

  <div class="portail-section flex justify-content-between">
    <div class="flex justify-content-center align-items-center">
      <p-breadcrumb [model]="items">
        <ng-template pTemplate="item" let-item>
          <ng-container *ngIf="item.route; else elseBlock">
            <a [routerLink]="item.route" class="p-menuitem-link" routerLinkActive="active-breadcrumb" #rla="routerLinkActive">
              <span [ngClass]="[item.icon ? item.icon : '', 'text-color', 'text-2xl']"></span>
              <span class="text-black-alpha-90 p-2 font-bold">{{ item.label }}</span>
            </a>
          </ng-container>
          <ng-template #elseBlock>
            <a [href]="item.url">
              <span class="text-color text-sm md:text-xl lg:text-2xl text-center">{{ item.label }}</span>
            </a>
          </ng-template>
        </ng-template>
      </p-breadcrumb>
    </div>

    <button pButton pRipple label="Ajouter frais" class="hidden md:block h-fit mt-2" size="small"
            icon="pi pi-plus" severity="primary" routerLink="/portail/frais-bancaire/new"></button>
    <button pButton pRipple pTooltip="Ajouter frais" class="md:hidden h-fit mt-2" size="small"
            icon="pi pi-plus" severity="primary" routerLink="/portail/frais-bancaire/new"></button>
  </div>

  <p-toolbar styleClass="bg-white">
    <ng-template pTemplate="left">
      <div class="flex flex-column md:flex-row gap-2 align-items-start md:align-items-center w-full">
        <div class="p-input-icon-left">
          <i class="pi pi-search"></i>
          <p-dropdown
            name="banque"
            [options]="banques"
            [(ngModel)]="selectedBanque"
            optionLabel="nom"
            placeholder="Sélectionner une banque"
            [virtualScroll]="true"
            [virtualScrollItemSize]="40"
            [lazy]="true"
            [loading]="banquesLoading"
            (onLazyLoad)="loadBanquesLazy($event)"
            (onChange)="applyFilters()"
            appendTo="body"
            [showClear]="true"
            [style]="{'min-width': '200px'}"
          ></p-dropdown>
        </div>

        <div class="p-input-icon-left">
          <i class="pi pi-search"></i>
          <p-dropdown
            name="status"
            [options]="statusOptions"
            [(ngModel)]="selectedStatus"
            optionLabel="label"
            optionValue="value"
            placeholder="Tous les statuts"
            (onChange)="applyFilters()"
            [showClear]="true"
            appendTo="body"
            [style]="{'min-width': '180px'}"
          ></p-dropdown>
        </div>

        <div class="p-input-icon-left">
          <i class="pi pi-search"></i>
          <input pInputText type="text" name="libelleFilter" placeholder="Rechercher par libellé"
                 [(ngModel)]="libelleFilter" (input)="applyFilters()"
                 [style]="{'min-width': '200px'}" />
        </div>
      </div>
    </ng-template>

    <ng-template pTemplate="right">
      <button
        pButton
        pRipple
        icon="pi pi-filter-slash"
        class="p-button-outlined p-button-secondary"
        (click)="clearFilters()"
        pTooltip="Effacer les filtres"
        label="Effacer"
      ></button>
    </ng-template>
  </p-toolbar>

  <div class="pb-8">
    <p-table #dt [value]="fraisBancaires" [paginator]="true" [rows]="10" [totalRecords]="totalRecords"
             [loading]="loading" [rowsPerPageOptions]="[10, 25, 50]" [lazy]="true"
             responsiveLayout="scroll" [scrollable]="true" scrollHeight="flex"
             (onLazyLoad)="loadFraisBancaires($event)"
             [columns]="[
                {field: 'libelle', header: 'Libellé', sortable: true},
                {field: 'banqueNom', header: 'Banque', sortable: true},
                {field: 'montant', header: 'Montant', sortable: true},
                {field: 'dateEmission', header: 'Date d\'émission', sortable: true},
                {field: 'status', header: 'Statut', sortable: true}
             ]"
             styleClass="p-datatable-gridlines text-xs"
             [showCurrentPageReport]="true"
             currentPageReportTemplate="{first}-{last} sur {totalRecords} | Page {currentPage} sur {totalPages}">

      <ng-template pTemplate="header" let-columns>
        <tr class="white-space-nowrap">
          <th *ngFor="let col of columns" [pSortableColumn]="col.sortable ? col.field : null">
            {{ col.header }}
            <p-sortIcon *ngIf="col.sortable" [field]="col.field"></p-sortIcon>
          </th>
          <th style="width: 8rem;">Actions</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-frais>
        <tr>
          <td>{{ frais.libelle }}</td>
          <td>{{ frais.banqueNom }}</td>
          <td>{{ frais.montant | number:'1.2-2' }} MAD</td>
          <td>{{ frais.dateEmission | date:'dd/MM/yyyy' }}</td>
          <td>
            <p-tag
              [value]="frais.status"
              [severity]="getStatusSeverity(frais.status)"
            ></p-tag>
          </td>
          <td class="flex flex-row align-items-center gap-2">
            <button pButton pRipple icon="pi pi-pencil"
                    class="p-button-rounded p-button-outlined p-button-secondary mr-2"
                    [routerLink]="['/portail/frais-bancaire/edit', frais.id]"></button>

            @if (isAdmin()) {
              <p-inputSwitch
                [ngModel]="frais.status === Status.PAYE"
                (click)="toggleFraisBancaireStatus(frais)"
                [pTooltip]="frais.status === 'REALISE' ? 'Marquer comme prévu' : 'Marquer comme réalisé'"
              ></p-inputSwitch>
              <button pButton pRipple icon="pi pi-trash"
                      class="p-button-rounded p-button-outlined p-button-danger"
                      [disabled]="frais.status === Status.PAYE"
                      (click)="deleteFraisBancaire(frais)"></button>
            }
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptyMessage">
        <tr>
          <td [attr.colspan]="8">Aucun frais bancaire trouvé.</td>
        </tr>
      </ng-template>

      <ng-template pTemplate="loadingbody">
        <tr>
          <td [attr.colspan]="8">Chargement en cours...</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
