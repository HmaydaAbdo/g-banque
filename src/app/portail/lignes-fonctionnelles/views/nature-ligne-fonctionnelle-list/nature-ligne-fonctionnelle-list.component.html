<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="w-screen h-screen overflow-y-scroll p-4">


  <div class="mb-3 ">

    <div class="flex justify-content-end mb-4">
      <button pButton pRipple label="Ajouter une Nature" icon="pi pi-plus" class="p-button-primary" (click)="addNewNature()"></button>
    </div>
    <form [formGroup]="searchForm" class="w-full">
      <div class="flex flex-column md:flex-row md:align-items-end md:justify-content-between">
        <div class="flex flex-column md:flex-row  gap-3 mb-3 md:mb-0">
          <div >
            <label for="searchLabel" class="block text-900 text-center font-medium mb-2">Libellé</label>
            <input id="searchLabel" type="text" pInputText formControlName="label" class="w-full" placeholder="Rechercher par libellé">
          </div>
          <div >
            <label for="searchDescription" class="block text-900 text-center font-medium mb-2">Description</label>
            <input id="searchDescription" type="text" pInputText formControlName="description" class="w-full" placeholder="Rechercher par description">
          </div>
        </div>

        <div class="flex-shrink-0">
          <button pButton pRipple icon="pi pi-times" class="p-button-danger ml-2" (click)="clearSearch()" pTooltip="Effacer la recherche"></button>
        </div>
      </div>
    </form>

  </div>

  <div >
    <p-table #dt
             [value]="natures"
             [lazy]="true"
             (onLazyLoad)="loadNatures($event)"
             [paginator]="true"
             [rows]="5"
             [totalRecords]="totalRecords"
             [loading]="loading" [rowsPerPageOptions]="[5,10, 25, 50]"
             [showCurrentPageReport]="true">

      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="label">Libellé <p-sortIcon field="label"></p-sortIcon></th>
          <th pSortableColumn="description">Description <p-sortIcon field="description"></p-sortIcon></th>
          <th>Actions</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-nature>
        <tr>
          <td>{{ nature.label }}</td>
          <td>{{ nature.description }}</td>
          <td>
            <button pButton pRipple icon="pi pi-pencil" class="p-button-rounded p-button-secondary mr-2" pTooltip="Modifier" tooltipPosition="top" (click)="editNature(nature.id!)"></button>
            @if (isAdmin()){
              <button pButton pRipple icon="pi pi-trash"  class="p-button-rounded  p-button-danger" pTooltip="Supprimer" tooltipPosition="top" (click)="deleteNature(nature.id!)"></button>
            }
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="5" class="text-center">Aucune nature de ligne fonctionnelle trouvée.</td>
        </tr>
      </ng-template>
      <ng-template pTemplate="loadingbody">
        <tr>
          <td colspan="5" class="text-center">Chargement des natures de ligne fonctionnelle. Veuillez patienter...</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
