<p-dialog header="Select a Bank" [(visible)]="displayDialog" [modal]="true" [style]="{ width: '50vw' }" (onHide)="onDialogHide()">
  <p-table [value]="banks" selectionMode="single" [(selection)]="selectedBank" dataKey="id">
    <ng-template pTemplate="header">
      <tr>
        <th>Name</th>
        <th>Account Number</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-bank>
      <tr (click)="selectBank(bank)">
        <td>{{ bank.nom }}</td>
        <td>{{ bank.numeroDeCompte }}</td>
      </tr>
    </ng-template>
  </p-table>
</p-dialog>
