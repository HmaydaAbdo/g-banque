services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 18 — base de données (dev = prod)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:18.6-alpine
    container_name: gbanque-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Locale ICU française : tri des textes à la française. Lu uniquement à la création du dossier de données.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=fr-FR --encoding=UTF8"
      TZ: ${TZ}
    # Accès local uniquement (127.0.0.1) : backend lancé depuis l'IDE (DB_HOST=localhost, DB_PORT=5433) ou outil
    # d'administration. 5433 pour ne pas entrer en conflit avec un PostgreSQL local sur 5432.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # Volume Docker nommé (et non un dossier de l'hôte) : stockage géré par Docker, sans problème de droits ni
      # de performances sous Windows. Transfert vers un autre serveur = sauvegarde + restauration
      # (cf. docs/infra/backup-postgres.md). PostgreSQL 18 : monter /var/lib/postgresql (et non plus .../data).
      - postgres-data:/var/lib/postgresql
    networks:
      - gbanque-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Sauvegarde PostgreSQL (pg_dump compressé, rotation jour/semaine/mois)
  # ---------------------------------------------------------------------------
  backup:
    image: prodrigestivill/postgres-backup-local:18-alpine-d257e5d
    container_name: gbanque-backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Base complète, compressée ; se restaure telle quelle dans une base vierge (cf. docs/infra/backup-postgres.md)
      POSTGRES_EXTRA_OPTS: "-Z9"
      SCHEDULE: "0 2 * * *"
      BACKUP_ON_START: "TRUE"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      TZ: ${TZ}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backups/postgres:/backups
    networks:
      - gbanque-network

  # ---------------------------------------------------------------------------
  # Spring Boot Backend - Internal host access on 8080 for Outer Nginx
  # ---------------------------------------------------------------------------
  backend:
    # Image publiée par la CI à chaque commit sur main (tags latest et <sha>). Pour revenir à une version
    # précise : remplacer latest par le sha du commit voulu.
    image: hmaydaabdo/gbanque-backend:latest
    container_name: gbanque-backend
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx1g"
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_ADRESSE: ${SERVER_ADRESSE}
      SERVER_PORT: ${SERVER_PORT}
      CONTEXT_PATH: ${CONTEXT_PATH}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES}
      JWT_REFRESH_TOKEN_HOURS: ${JWT_REFRESH_TOKEN_HOURS}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_PROTOCOL: ${MAIL_PROTOCOL}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_NOTIFICATION_RECIPIENTS: ${MAIL_NOTIFICATION_RECIPIENTS}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - backend-logs:/app/logs
    networks:
      - gbanque-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/gbanque/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ---------------------------------------------------------------------------
  # Angular Frontend (Inner Nginx) - Bound to local host port 8081
  # ---------------------------------------------------------------------------
  frontend:
    image: hmaydaabdo/gbanque-frontend:latest
    container_name: gbanque-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "127.0.0.1:8081:80"
    networks:
      - gbanque-network
    environment:
      TZ: ${TZ}
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Administration de la base (accès local uniquement)
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:9.17
    container_name: gbanque-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - gbanque-network

networks:
  gbanque-network:
    driver: bridge

# Noms fixes (indépendants du nom du dossier) : mêmes volumes quel que soit l'endroit où le projet est installé.
volumes:
  # Base PostgreSQL — NE JAMAIS supprimer sans sauvegarde vérifiée (`docker compose down -v` la détruit)
  postgres-data:
    name: gbanque-postgres-data
  pgadmin-data:
    name: gbanque-pgadmin-data
  # Logs applicatifs du backend : un fichier par jour, conservés entre les redéploiements
  backend-logs:
    name: gbanque-backend-logs
