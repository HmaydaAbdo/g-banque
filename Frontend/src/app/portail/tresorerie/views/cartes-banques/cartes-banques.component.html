<ul class="cartes">
  @for (b of ordonnees; track b.banqueId) {
    @if (niveau(b); as n) {
      <li>
        <button type="button" class="carte-banque carte-banque--{{ n }}" [class.carte-banque--sel]="selection === b.banqueId"
                (click)="ouvrir(b)" [attr.aria-label]="b.banqueNom + ' : ' + libelleSituation(n) + ', ouvrir le détail'">

          <span class="carte-banque__tete">
            <span class="carte-banque__nom">{{ b.banqueNom }}</span>
            <span class="carte-banque__etat carte-banque__etat--{{ n }}">{{ libelleSituation(n) }}</span>
          </span>

          @if (n === 'danger') {
            <span class="carte-banque__cle carte-banque__cle--danger">{{ compact(b.besoinFinancement) }}<small>{{ b.devise }}</small></span>
            <span class="carte-banque__sous">{{ b.pointBas.date | date:'dd/MM' }}@if (anciennete(b); as a) { · {{ a }} }</span>
          } @else {
            <span class="carte-banque__cle" [class.carte-banque__cle--warn]="n === 'warn'">{{ compact(b.pointBas.solde) }}<small>{{ b.devise }}</small></span>
            <span class="carte-banque__sous">solde le plus bas · {{ b.pointBas.date | date:'dd/MM' }}</span>
          }

          <span class="carte-banque__soldes">
            <span><small>Actuel</small>{{ compact(b.soldeActuel) }}</span>
            <span><small>Prévu</small>{{ compact(b.soldeFinal) }}</span>
          </span>

          @if (b.plafondFC > 0) {
            <span class="jauge" role="img"
                  [attr.aria-label]="'Facilité de caisse utilisée à ' + (partFacilite(b) * 100 | number:'1.0-0') + ' %'">
              <span class="jauge__barre jauge__barre--{{ n }}" [style.width.%]="partFacilite(b) * 100"></span>
            </span>
            <span class="carte-banque__sous">FC {{ compact(b.plafondFC) }} · {{ partFacilite(b) * 100 | number:'1.0-0' }} %</span>
          }

          @if (uneBanqueEnBesoin && excedent(b) > 0) {
            <span class="carte-banque__excedent">Excédent {{ compact(excedent(b)) }}</span>
          }

          @if (trajectoire(b); as t) {
            <svg viewBox="0 0 80 24" class="spark spark--{{ n }}" aria-hidden="true" preserveAspectRatio="none">
              @if (t.zero !== null) { <line x1="0" x2="80" [attr.y1]="t.zero" [attr.y2]="t.zero" class="spark__zero"/> }
              <polyline [attr.points]="t.points" fill="none"/>
            </svg>
          }
        </button>
      </li>
    }
  }
</ul>
