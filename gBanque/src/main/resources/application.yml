server:
#  address: 0.0.0.0
  port: 8080
  servlet:
    contextPath: /gBanque/api

spring:

  application:
    name: gBanque

  datasource:

    url: jdbc:mysql://localhost:3306/GBanque?useSSL=false&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  batch:
    job:
      enabled: true
    jdbc:
      initialize-schema: always

  mail:
    host: localhost
    port: 1025
    username: ''
    password: ''
    from: no-reply@Gbanque.com
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false




functional:
  line:
    expiration:
      alert:
        threshold:
          months: 2
      warning:
        threshold:
          months: 3

leasing:
  contract:
    valeur-residuelle: 0.01
    taux-tva: 0.2





