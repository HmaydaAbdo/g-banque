<section class="console" role="toolbar" aria-label="Filtres et export">

  <div class="console__champ">
    <span class="console__label">Horizon</span>
    <p-selectButton [formControl]="horizon" [options]="horizonOptions" optionLabel="label" optionValue="value"
                    [allowEmpty]="false" styleClass="p-button-sm"/>
  </div>

  @if (devises.length > 1) {
    <div class="console__champ">
      <span class="console__label">Devise</span>
      <p-selectButton [formControl]="devise" [options]="devises" [allowEmpty]="false" styleClass="p-button-sm"/>
    </div>
  }

  <div class="console__filtres" role="group" aria-label="Filtres actifs">
    @if (filtres.length === 0) {
      <span class="console__vide"><i class="pi pi-filter" aria-hidden="true"></i> Aucun filtre actif</span>
    } @else {
      @for (f of filtres; track f.cle) {
        <span class="pastille">
          <span class="pastille__nom">{{ f.libelle }}</span> {{ f.valeur }}
          <button type="button" class="pastille__retirer" (click)="f.retirer()"
                  [attr.aria-label]="'Retirer le filtre ' + f.libelle + ' : ' + f.valeur"><i class="pi pi-times" aria-hidden="true"></i></button>
        </span>
      }
    }
  </div>

  <div class="console__actions">
    @if (filtres.length > 0) {
      <button type="button" class="console__effacer" (click)="effacer.emit()">Effacer les filtres</button>
    }
    <p-button label="Exporter PDF" icon="pi pi-file-pdf" size="small" [loading]="exportEnCours" [disabled]="!exportPossible"
              [pTooltip]="'Exporter : ' + perimetreExport" tooltipPosition="bottom" (onClick)="exporter.emit()"/>
  </div>
</section>
