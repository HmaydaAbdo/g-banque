<div class="flex h-screen w-full">
  <!-- Sidebar -->
  <div class="col-fixed w-18rem p-2 h-full shadow-2 bg-white">
    <ul class="list-none p-3 m-0">
      <ng-container *ngFor="let item of items">
        <li *ngIf="item.separator">
          <hr class="mb-3 mx-3 border-top-1 border-3 surface-border" />
        </li>

        <li *ngIf="item.routerLink && !item.items">
          <a pRipple
             [routerLink]="item.routerLink"
             routerLinkActive="active-sidebar-link"
             class="flex align-items-center cursor-pointer p-3 border-round-xl transition-duration-150 transition-colors p-ripple sidebar-link">
            <i *ngIf="item.icon" [class]="item.icon + ' mr-2'"></i>
            <span class="font-medium">{{ item.label }}</span>
          </a>
        </li>

        <li *ngIf="item.items">
          <div
            pRipple
            (click)="toggleMenuItem(item)"
            [ngClass]="item.styleClass || 'p-3 flex align-items-center justify-content-between text-600 cursor-pointer p-ripple'">
            <div class="flex align-items-center">
              <i *ngIf="item.icon" [class]="item.icon + ' mr-2'"></i>
              <span class="font-medium">{{ item.label }}</span>
            </div>
            <!-- Ajout de l'icône de la flèche ici -->
            <i *ngIf="item.items" [class]="item.expanded ? 'pi pi-chevron-down' : 'pi pi-chevron-right'"></i>
          </div>

          <ul class="list-none p-0 m-0 overflow-hidden" [ngClass]="{'hidden': !item.expanded}">
            <ng-container *ngFor="let subItem of item.items">
              <li *ngIf="subItem.routerLink && !subItem.items">
                <a pRipple
                   [routerLink]="subItem.routerLink"
                   routerLinkActive="active-sidebar-link"
                   class="flex align-items-center cursor-pointer p-3 pl-5 border-round-xl transition-duration-150 transition-colors p-ripple sidebar-link">
                  <i *ngIf="subItem.icon" [class]="subItem.icon + ' mr-2'"></i>
                  <span class="font-medium">{{ subItem.label }}</span>

                </a>
              </li>

              <li *ngIf="subItem.items">
                <div
                  pRipple
                  (click)="toggleMenuItem(subItem)"
                  class="flex align-items-center cursor-pointer p-3 pl-5 border-round text-700 transition-duration-150 transition-colors p-ripple">
                  <i *ngIf="subItem.icon" [class]="subItem.icon + ' mr-2'"></i>
                  <span class="font-medium">{{ subItem.label }}</span>
                  <i [class]="subItem.expanded ? 'pi pi-chevron-down ml-auto' : 'pi pi-chevron-right ml-auto'"></i>
                </div>

                <ul class="list-none py-0 pl-3 pr-0 m-0 overflow-hidden" [ngClass]="{'hidden': !subItem.expanded}">
                  <li *ngFor="let subSubItem of subItem.items">
                    <a pRipple
                       [routerLink]="subSubItem.routerLink"
                       routerLinkActive="active-sidebar-link"
                       class="flex align-items-center cursor-pointer p-3 pl-7 border-round-xl transition-duration-150 transition-colors p-ripple sidebar-link">
                      <i *ngIf="subSubItem.icon" [class]="subSubItem.icon + ' mr-2'"></i>
                      <span class="font-medium">{{ subSubItem.label }}</span>

                    </a>
                  </li>
                </ul>
              </li>
            </ng-container>
          </ul>
        </li>
      </ng-container>
    </ul>
  </div>

  <!-- Main Content Area -->
  <div class="flex flex-column gap-2 col overflow-y-auto shadow-2 ">
    <div class="flex justify-content-center p-2">
      <p-breadcrumb [model]="breadcrumbItems" [style]="{'background-color': 'transparent', 'border': 'none'}" >
        <ng-template pTemplate="item" let-item>
          <ng-container *ngIf="item.route; else elseBlock">
            <a [routerLink]="item.route" class="p-menuitem-link" routerLinkActive="active-breadcrumb" #rla="routerLinkActive">
              <span [ngClass]="[item.icon ? item.icon : '', 'text-color', 'text-2xl']"></span>
              <span class="text-black-alpha-90 p-2 font-bold">{{ item.label }}</span>
            </a>

          </ng-container>
          <ng-template #elseBlock>
            <a [href]="item.url">
              <span class="text-color text-sm  md:text-xl lg:text-2xl text-center">{{ item.label }}</span>
            </a>
          </ng-template>
        </ng-template>
      </p-breadcrumb>
    </div>

    <app-bank-details [banqueId]="banqueId"></app-bank-details>
    <router-outlet></router-outlet>
  </div>
</div>
