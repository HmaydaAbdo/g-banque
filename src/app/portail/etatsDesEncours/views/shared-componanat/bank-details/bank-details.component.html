<div class=" w-full min-h-6rem ">

  <!-- Loading state -->
  <div *ngIf="loading" class="p-text-center p-text-secondary" style="width: 100%;">
    Chargement...
  </div>

  <div *ngIf="!loading && bankInfo" class="w-full flex flex-row justify-content-between px-4  ">

    <p>
      <strong>Banque : </strong><span >{{bankInfo.name}} </span>
    </p>

    <p>
      <strong>Solde Départ : </strong> <span >{{bankInfo.soldeDepart | number: '1.2-2'}}</span>
    </p>

    <p>
      <strong>Solde actuel : </strong><span >{{bankInfo.soldeActuelle | number: '1.2-2'}}</span>
    </p>


    @if (bankInfo.plafondFC) {
        <p >
          <strong> Facilité de caisse :</strong><span>{{bankInfo.plafondFC | number: '1.2-2'}} </span>
        </p>
    } @else {
      <p >
        <strong> Facilité de caisse :</strong> Aucune
      </p>    }



  </div>

</div>
