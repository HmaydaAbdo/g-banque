<div class="portail-section h-screen w-screen overflow-y-scroll px-4 py-2 flex flex-column gap-3">

  <div class="flex justify-content-center w-full">
    <p-breadcrumb [model]="items">
      <ng-template pTemplate="item" let-item>
        <ng-container>
          <a [routerLink]="item.route" class="p-menuitem-link" routerLinkActive="active-breadcrumb" #rla="routerLinkActive">
            <span [ngClass]="[item.icon ? item.icon : '', 'text-color', 'text-2xl']"></span>
            <span class="text-black-alpha-90 p-2 font-bold">{{ item.label }}</span>
          </a>
        </ng-container>
      </ng-template>
    </p-breadcrumb>
  </div>

  <div class="flex flex-wrap justify-content-center  pb-8 gap-2">
    <div *ngFor="let kpi of kpis"
         class="flex flex-column justify-content-center align-content-between col-12 md:col-3 shadow-2 hover:shadow-8 text-center border-round-sm surface-overlay p-2 h-15rem cursor-pointer transition-all-0-2s"
         [routerLink]="[kpi.route]" routerLinkActive="active-card" [pTooltip]="'Cliquer pour ' + kpi.description" tooltipPosition="bottom">
      <i [class]="kpi.icon" [style.color]="kpi.iconColor || 'var(--primary-color)'" style="font-size: 4.5rem;"></i>
      <h4>{{ kpi.label }}</h4>
      <p class="text-sm">{{ kpi.description }}</p>
    </div>
  </div>
</div>
