spring:
  datasource:
    url: jdbc:mysql://prod-db:3306/GBanque?useSSL=true&serverTimezone=UTC
    username: produser
    password: ${DB_PASSWORD}   # don’t hardcode
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  batch:
    job:
      enabled: true
    jdbc:
      initialize-schema: never
