# =============================================================================
# G-Banque — Configuration commune (tous profils)
# Le profil actif est contrôlé par SPRING_PROFILES_ACTIVE dans .env
# Dev : application-dev.yml  |  Prod : application-prod.yml
# =============================================================================

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    lazy-initialization: true
  application:
    name: gBanque
  data:
    web:
      pageable:
        max-page-size: 100
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${MYSQL_DATABASE}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  jpa:
    properties:
      hibernate:
        ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true  # DB existante (XAMPP/prod) : baseline à V1, V1 non ré-exécuté
    baseline-version: 1        # DB vide : V1 exécuté normalement ; DB existante : V1 skippé
    validate-on-migrate: true
    out-of-order: false
  batch:
    job:
      enabled: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: ${MAIL_PROTOCOL:smtp}
    from: ${MAIL_FROM}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: false
      mail.smtp.ssl.trust: ${MAIL_HOST}
      mail.smtp.ssl.checkserveridentity: false
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
    notification:
      batch-job:
        enabled: true
        recipients: ${MAIL_NOTIFICATION_RECIPIENTS}

server:
  address: ${SERVER_ADRESSE}
  port: ${SERVER_PORT}
  servlet:
    context-path: ${CONTEXT_PATH}

jwt:
  secret: ${JWT_SECRET}

springdoc:
  # Swagger activé en dev (SWAGGER_ENABLED=true), désactivé en prod (false)
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  health:
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${SPRING_PROFILES_ACTIVE:dev}

# =============================================================================
# Domaine métier — commun aux deux profils
# =============================================================================
functional:
  line:
    expiration:
      alert:
        threshold:
          months: 2
      warning:
        threshold:
          months: 3
    job:
      general:
        enabled: true
      specific:
        enabled: true
    jobs:
      enabled: true
      cron: "0 0 12 ? * SUN"
      sequential: true
      abort-on-general-failure: false

leasing:
  main-levee:
    job:
      enabled: true
      cron: "0 0 14 ? * SUN"
  contract:
    valeur-residuelle: 0.01
    taux-tva: 0.2

cmt:
  main-levee:
    job:
      enabled: true
      cron: "0 30 14 ? * SUN"

commission:
  virement:
    bmci:
      montant-fixe: 33
  leasing:
    default-commissions:
      CIH: 11
      "[SAHAM BANK]": 11
    organisme-rules:
      BMCI:
        organisme-name: "BMCI LEASING"
        commission-if-match: 16.5
        commission-if-not-match: 55

logging:
  pattern:
    console: "%d{HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
