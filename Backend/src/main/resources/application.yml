# =============================================================================
# G-Banque — Configuration unique (environnement unique : le dev est identique à la prod)
# Aucun profil Spring : ce qui diffère d'une machine à l'autre (hôte DB, secrets, Swagger,
# cookies Secure…) vient exclusivement des variables d'environnement (.env, cf. .env.example).
# =============================================================================

spring:
  application:
    name: gBanque
  data:
    web:
      pageable:
        max-page-size: 100
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${MYSQL_DATABASE}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: GbanquePool
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      validation-timeout: 5000
      connection-timeout: 20000
      max-lifetime: 1800000
  jpa:
    open-in-view: true
    hibernate:
      # Le schéma est géré exclusivement par Flyway (db/migration) ; Hibernate vérifie seulement
      # au démarrage que les entités correspondent au schéma, et refuse de démarrer sinon.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  batch:
    job:
      enabled: true
    jdbc:
      # Tables Spring Batch créées par la migration Flyway V1
      initialize-schema: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Base existante sans historique Flyway (production au moment de l'adoption, 10/10/2026) :
    # Flyway la marque en version 1 sans exécuter V1, puis applique V2 et suivantes.
    # Sans effet sur une base vide, qui est construite entièrement par V1, V2…
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Schema de production au 10/10/2026
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: ${MAIL_PROTOCOL}
    from: ${MAIL_FROM}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: false
      mail.smtp.ssl.trust: ${MAIL_HOST}
      mail.smtp.ssl.checkserveridentity: false
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
    notification:
      batch-job:
        enabled: true
        recipients: ${MAIL_NOTIFICATION_RECIPIENTS}

server:
  address: ${SERVER_ADRESSE}
  port: ${SERVER_PORT}
  servlet:
    context-path: ${CONTEXT_PATH}

jwt:
  secret: ${JWT_SECRET}
  # Jeton d'accès court, renouvelé en silence ; la session dure au plus refresh-token-hours (reconnexion ensuite)
  access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES}
  refresh-token-hours: ${JWT_REFRESH_TOKEN_HOURS}

auth:
  cookie:
    # true dès que G-Banque est servi en HTTPS (cookies de session et XSRF marqués Secure)
    secure: ${AUTH_COOKIE_SECURE}
  refresh-token:
    # Purge quotidienne des jetons de rafraîchissement expirés
    cleanup-cron: "0 15 3 * * *"

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

login:
  max-attempts: ${LOGIN_MAX_ATTEMPTS}
  lockout-minutes: ${LOGIN_LOCKOUT_MINUTES}

springdoc:
  # Swagger activé en dev (SWAGGER_ENABLED=true), désactivé en prod (false)
  api-docs:
    enabled: ${SWAGGER_ENABLED}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  health:
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# =============================================================================
# Domaine métier — commun aux deux profils
# =============================================================================
functional:
  line:
    expiration:
      alert:
        threshold:
          months: 2
      warning:
        threshold:
          months: 3
    job:
      general:
        enabled: true
      specific:
        enabled: true
    jobs:
      enabled: true
      cron: "0 0 12 ? * SUN"
      sequential: true
      abort-on-general-failure: false

leasing:
  main-levee:
    job:
      enabled: true
      cron: "0 0 14 ? * SUN"

cmt:
  main-levee:
    job:
      enabled: true
      cron: "0 30 14 ? * SUN"

logging:
  pattern:
    console: "%d{HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
