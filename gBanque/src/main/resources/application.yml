server:
  servlet:
    contextPath: /gBanque/api

spring:
  application:
    name: gBanque
  profiles:
    active: dev
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000




functional:
  line:
    expiration:
      alert:
        threshold:
          months: 2
      warning:
        threshold:
          months: 3

leasing:
  contract:
    valeur-residuelle: 0.01
    taux-tva: 0.2


logging:
  level:
    org.springframework: WARN
    org.hibernate.SQL: WARN



