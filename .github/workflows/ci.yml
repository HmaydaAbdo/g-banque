# =============================================================================
# G-Banque — Pipeline CI
#   backend    : compilation + tests d'intégration (Testcontainers MySQL 8) + couverture JaCoCo
#   frontend   : tests Karma + couverture + build de production
#   security   : secrets (gitleaks) + dépendances/configuration (Trivy fs)
#   images     : build des 2 images Docker, scan Trivy, rapport de taille,
#                push Docker Hub uniquement sur main
# Le déploiement (CD par SSH) viendra dans un workflow séparé : cd.yml.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Seuil de couverture exigé sur les lignes AJOUTÉES/MODIFIÉES d'une PR (diff-cover).
  # 0 = rapport seul. À relever par paliers (30 → 50 → 70 → 80) quand les tests rattrapent le code.
  DIFF_COVER_MIN: 0

jobs:
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (build + tests + couverture)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # nécessaire à diff-cover (comparaison avec la branche de base)

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build + tests + couverture
        working-directory: Backend
        run: mvn -B -ntp verify

      - name: Résumé de couverture
        if: always()
        run: python3 .github/scripts/jacoco_summary.py Backend/target/site/jacoco/jacoco.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Couverture du code modifié (PR)
        if: github.event_name == 'pull_request'
        run: |
          pip install --quiet diff-cover
          diff-cover Backend/target/site/jacoco/jacoco.xml \
            --compare-branch="origin/${{ github.base_ref }}" \
            --fail-under="$DIFF_COVER_MIN" \
            --markdown-report diff-cover-backend.md || RC=$?
          { echo "### Couverture du code backend modifié"; cat diff-cover-backend.md; } >> "$GITHUB_STEP_SUMMARY"
          exit "${RC:-0}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-reports
          path: |
            Backend/target/site/jacoco/
            Backend/target/surefire-reports/
          retention-days: 14

  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (tests + couverture + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Installation (reproductible)
        working-directory: Frontend
        run: npm ci --no-audit --no-fund

      # TEMPORAIRE : 58 des 61 specs actuels sont des squelettes générés par le CLI qui échouent
      # (providers manquants). Non bloquant jusqu'à leur remplacement — voir TODO.md
      # « Chantier — Stratégie de tests ». Retirer continue-on-error à ce moment-là.
      - name: Tests unitaires + couverture
        id: ng-test
        continue-on-error: true
        working-directory: Frontend
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI --code-coverage

      - name: Résumé tests
        if: always()
        run: |
          echo "### Tests frontend - résultat : ${{ steps.ng-test.outcome }} (échec non bloquant temporaire, voir TODO.md)" >> "$GITHUB_STEP_SUMMARY"

      - name: Couverture du code modifié (PR)
        if: github.event_name == 'pull_request' && hashFiles('Frontend/coverage/lcov.info') != ''
        run: |
          pip install --quiet diff-cover
          diff-cover Frontend/coverage/lcov.info \
            --compare-branch="origin/${{ github.base_ref }}" \
            --fail-under="$DIFF_COVER_MIN" \
            --markdown-report diff-cover-frontend.md || RC=$?
          { echo "### Couverture du code frontend modifié"; cat diff-cover-frontend.md; } >> "$GITHUB_STEP_SUMMARY"
          exit "${RC:-0}"

      - name: Build de production
        working-directory: Frontend
        run: npm run build -- --configuration production

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: Frontend/coverage/
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  security:
    name: Sécurité (secrets + dépendances)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Détection de secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --redact --no-banner --exit-code 1

      # Dépendances (pom.xml, package-lock.json), Dockerfile, IaC. HIGH/CRITICAL corrigeables uniquement.
      - name: Trivy — dépendances et configuration
        # Backend : Spring Boot 3.3.1 porte des CVE connues (voir TODO.md, chantier montée de version).
        # pom.xml exclu : Trivy interroge Maven Central (429 sur les runners partagés) ; les dépendances Java sont
        # couvertes par le scan de l'image backend (job images).
        # Rapport seul (--exit-code 0) tant que la montée de version n'est pas faite ; repasser à 1 ensuite.
        run: |
          docker run --rm -v "$PWD:/src" -v trivy-cache:/root/.cache aquasec/trivy:0.75.0             fs --skip-files /src/Backend/pom.xml --scanners vuln,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 /src

  # ---------------------------------------------------------------------------
  images:
    name: Image Docker (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [backend, frontend, security]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: Backend
            # Bloquant dès que la montée de version Spring Boot est faite (voir TODO.md)
            trivy-exit-code: "0"
          - name: frontend
            context: Frontend
            trivy-exit-code: "1"
    env:
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
      IMAGE: gbanque-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build (chargé en local pour scan)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Taille de l'image
        run: |
          SIZE=$(docker image inspect "$IMAGE:ci" --format '{{.Size}}')
          echo "### Image ${{ matrix.name }} : $((SIZE/1024/1024)) Mo" >> "$GITHUB_STEP_SUMMARY"

      - name: Scan Trivy de l'image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache             aquasec/trivy:0.75.0 image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed             --exit-code ${{ matrix.trivy-exit-code }} "$IMAGE:ci"

      # Push uniquement depuis main, et seulement si Docker Hub est configuré
      # (DOCKERHUB_USERNAME en variable ou secret + secret DOCKERHUB_TOKEN).
      - name: Connexion Docker Hub
        id: login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.DOCKERHUB_NAMESPACE != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Hub
        if: steps.login.outcome == 'success'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE }}:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
