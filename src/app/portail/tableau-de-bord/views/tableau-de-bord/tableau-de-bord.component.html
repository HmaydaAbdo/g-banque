<div class="h-screen w-screen  flex flex-column  gap-8 overflow-y-scroll px-4 pt-4 pb-8">

  <div class="flex flex-wrap gap-2 justify-content-around ">
    <div class=" bg-orange-100 col-12 sm:col-6 md:col-4 lg:col-3 p-3 border-round p-shadow-3 flex flex-column justify-content-center align-items-center">
      <h3 class=" text-xl font-medium">Solde Total Actuelle </h3>
      <p class="text-xl font-bold text-primary-500">{{consolidatedTreasury}} DH</p>
    </div>

    <div class=" bg-indigo-100 col-12 sm:col-6 md:col-4 lg:col-3 p-3 border-round p-shadow-3 flex flex-column justify-content-center align-items-center">
      <h3 class=" text-xl font-medium">Nombre de banque actifs </h3>
      <p class="text-xl font-bold text-primary-500">9</p>
    </div>
    <div class=" bg-cyan-100 col-12 sm:col-6 md:col-4 lg:col-3 p-3 border-round p-shadow-3 flex flex-column justify-content-center align-items-center">
      <h3 class=" text-xl font-medium">an other KPI</h3>
      <p class="text-xl font-bold text-primary-500">$25,345</p>
    </div>

  </div>

  <div class="flex flex-wrap justify-content-around">
    <div class="col-12 md:col-6 lg:col-6 flex">
      <p-chart type="bar" [data]="bankBalanceChartData" [options]="bankBalanceChartOptions" class="w-full"></p-chart>
    </div>
    <div class="col-12 md:col-6 lg:col-6 flex">
      <p-chart type="bar" [data]="bankBalanceChartData" [options]="bankBalanceChartOptions" class="w-full"></p-chart>
    </div>
  </div>
</div>
