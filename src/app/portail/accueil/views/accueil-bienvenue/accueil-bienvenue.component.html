<div class="flex flex-column align-items-center justify-content-center w-screen h-screen gap-4"
     style="background: var(--color-page-bg)">

  <div class="flex flex-column align-items-center gap-3 text-center"
       style="max-width: 480px; padding: var(--space-8)">

    <i class="pi pi-building"
       style="font-size: var(--text-icon); color: var(--color-primary)"></i>

    <h1 style="font-size: var(--text-title); font-weight: var(--weight-bold);
                color: var(--color-text-primary); margin: 0">
      Bienvenue{{ username ? ', ' + username : '' }}
    </h1>

    <p style="font-size: var(--text-base); color: var(--color-text-secondary); margin: 0; line-height: var(--leading-relaxed)">
      Le tableau de bord de votre département est en cours de déploiement.
      Accédez à vos modules via le menu latéral.
    </p>

  </div>

</div>
