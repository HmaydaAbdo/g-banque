# Profil TEST — surcharge de application.yml pour les tests d'intégration.
# Le schéma est créé à la volée sur le MySQL Testcontainers (jamais de ddl-auto hors dev/test).
spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
functional:
  line:
    job:
      general:
        enabled: false
      specific:
        enabled: false
    jobs:
      enabled: false
leasing:
  main-levee:
    job:
      enabled: false
cmt:
  main-levee:
    job:
      enabled: false
