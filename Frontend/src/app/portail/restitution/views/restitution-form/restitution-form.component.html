<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="w-full h-full overflow-y-scroll p-2">
  <div class="portail-section flex justify-content-center align-items-center">
    <div class="flex justify-content-center w-full">
      <p-breadcrumb [model]="items">
        <ng-template pTemplate="item" let-item>
          <ng-container>
            <a [routerLink]="item.route" class="p-menuitem-link" routerLinkActive="active-breadcrumb" #rla="routerLinkActive">
              <span [ngClass]="[item.icon ? item.icon : '', 'text-color', 'text-2xl']"></span>
              <span class="text-black-alpha-90 p-2 font-bold">{{ item.label }}</span>
            </a>
          </ng-container>
        </ng-template>
      </p-breadcrumb>
    </div>
  </div>

  <div class="card p-4 shadow-sm w-full lg:w-9 md:w-10 mx-auto">
    <div class="card-header text-center">
      <h2 class="text-2xl font-bold">
        {{ isEditMode ? 'Modifier la Restitution' : 'Ajouter une Nouvelle Restitution' }}
      </h2>
    </div>

    <form [formGroup]="restitutionForm" (ngSubmit)="onSubmit()">
      <div class="p-fluid grid formgrid">

        <div class="field col-12 md:col-4">
          <label class="font-semibold">Banque <span class="text-red-500">*</span></label>
          <p-dropdown
            formControlName="banqueId"
            [options]="banquesOptions"
            optionLabel="nom"
            optionValue="id"
            placeholder="Sélectionner une banque"
            [showClear]="true"
            [virtualScroll]="true"
            [lazy]="true"
            [virtualScrollItemSize]="38"
            (onLazyLoad)="loadBanques($event)"
            [ngClass]="{'ng-invalid ng-dirty': f['banqueId'].invalid && f['banqueId'].touched}"
            appendTo="body"
          ></p-dropdown>
          <small *ngIf="f['banqueId'].invalid && f['banqueId'].touched" class="p-error">Obligatoire.</small>
        </div>

        <div class="field col-12 md:col-4">
          <label class="font-semibold">Montant (MAD) <span class="text-red-500">*</span></label>
          <p-inputNumber
            formControlName="montant"
            mode="decimal"
            [minFractionDigits]="2"
            [maxFractionDigits]="2"
            placeholder="0.00"
            [ngClass]="{'ng-invalid ng-dirty': f['montant'].invalid && f['montant'].touched}"
          ></p-inputNumber>
          <small *ngIf="f['montant'].invalid && f['montant'].touched" class="p-error">Montant invalide.</small>
        </div>

        <div class="field col-12 md:col-4">
          <label class="font-semibold">Date d'émission <span class="text-red-500">*</span></label>
          <p-calendar
            formControlName="dateEmission"
            dateFormat="dd/mm/yy"
            [showIcon]="true"
            [showButtonBar]="true"
            appendTo="body"
            placeholder="jj/mm/aaaa"
            [ngClass]="{'ng-invalid ng-dirty': f['dateEmission'].invalid && f['dateEmission'].touched}"
          ></p-calendar>
          <small *ngIf="f['dateEmission'].invalid && f['dateEmission'].touched" class="p-error">Date requise.</small>
        </div>

        <div class="field col-12 md:col-6">
          <label class="font-semibold">Libellé <span class="text-red-500">*</span></label>
          <textarea
            pInputTextarea
            formControlName="libelle"
            rows="3"
            autoResize="true"
            placeholder="Entrez le libellé"
            [ngClass]="{'ng-invalid ng-dirty': f['libelle'].invalid && f['libelle'].touched}">
          </textarea>
          <small *ngIf="f['libelle'].invalid && f['libelle'].touched" class="p-error">Libellé requis.</small>
        </div>

        <div class="field col-12 md:col-6">
          <label class="font-semibold">Observation <span class="text-red-500">*</span></label>
          <textarea
            pInputTextarea
            formControlName="observation"
            rows="3"
            autoResize="true"
            placeholder="Entrez une observation"
            [ngClass]="{'ng-invalid ng-dirty': f['observation'].invalid && f['observation'].touched}">
          </textarea>
          <small *ngIf="f['observation'].invalid && f['observation'].touched" class="p-error">Observation requise.</small>
        </div>

        <div class="col-12 mt-4 flex flex-row gap-2">
          <button
            pButton
            pRipple
            label="Annuler"
            icon="pi pi-times"
            type="button"
            class="p-button-secondary"
            (click)="onCancel()"
            [disabled]="loading">
          </button>
          <button
            pButton
            pRipple
            [label]="isEditMode ? 'Modifier' : 'Créer'"
            [icon]="isEditMode ? 'pi pi-check' : 'pi pi-plus'"
            type="submit"
            class="p-button-success"
            [disabled]="restitutionForm.invalid || loading"
            [loading]="loading">
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
