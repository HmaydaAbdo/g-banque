<div class="h-screen w-screen overflow-y-scroll flex flex-column  align-items-center p-2">
  <div class="flex justify-content-center w-full">
    <p-breadcrumb [model]="items" [style]="{'background-color': 'transparent', 'border': 'none'}">
      <ng-template pTemplate="item" let-item>
        <ng-container>
          <a [routerLink]="item.route" class="p-menuitem-link" routerLinkActive="active-breadcrumb" #rla="routerLinkActive">
            <span [ngClass]="[item.icon ? item.icon : '', 'text-color', 'text-2xl']"></span>
            <span class="text-black-alpha-90 p-2 font-bold">{{ item.label }}</span>
          </a>
        </ng-container>
      </ng-template>
    </p-breadcrumb>
  </div>
  <h2 class="mb-4 text-color">Solde Actuel par Banque</h2>

  <div *ngIf="loading" class="text-center text-color-secondary mt-4">
    Chargement des données...
  </div>

  <div *ngIf="errorMessage" class="p-error-message text-center text-red-500 mt-4">
    {{ errorMessage }}
  </div>

  <p-chart *ngIf="chartData"
           type="bar"
           [data]="chartData"
           [options]="chartOptions"
           class="w-full h-30rem">
  </p-chart>

  <div *ngIf="!loading && !errorMessage && !chartData"
       class="p-4 text-center text-color-secondary">
    Aucune donnée de solde de banque disponible à afficher.
  </div>
</div>
