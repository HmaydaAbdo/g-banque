<div class=" w-full min-h-6rem ">

  <!-- Loading state -->
  <div *ngIf="loading" class="p-text-center p-text-secondary" style="width: 100%;">
    Chargement...
  </div>

  <div *ngIf="!loading && bankInfo" class="w-full flex flex-row justify-content-between px-4  ">

    <p>Banque : {{bankInfo.name}}</p>
    <p>Solde Départ : {{bankInfo.soldeDepart | number: '1.2-2'}}</p>

    <p>Solde actuel : {{bankInfo.soldeActuelle | number: '1.2-2'}}</p>


    @if (bankInfo.plafondFC) {
        <p >Facilité de caisse :{{bankInfo.plafondFC | number: '1.2-2'}}</p>
    } @else {
      <p >Facilité de caisse : Aucune</p>    }



  </div>

</div>
