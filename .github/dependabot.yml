# Mises à jour automatiques groupées : une PR par écosystème et par semaine (revue + CI avant merge)
version: 2
updates:
  - package-ecosystem: maven
    directory: /Backend
    schedule: { interval: weekly }
    groups:
      maven-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /Frontend
    schedule: { interval: weekly }
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /Backend
    schedule: { interval: weekly }
    # Les montées de version majeures (Java 17 → 25, Node 20 → 22, …) sont des décisions de projet, pas des PR automatiques
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # Le tag de l'image de build encode la version de Java dans un suffixe (3.9-eclipse-temurin-17-alpine) :
      # Dependabot y voit une mise à jour mineure. Image de build seulement, mise à jour manuelle avec Java.
      - dependency-name: "maven"
  - package-ecosystem: docker
    directory: /Frontend
    schedule: { interval: weekly }
    # Les montées de version majeures (Java 17 → 25, Node 20 → 22, …) sont des décisions de projet, pas des PR automatiques
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
