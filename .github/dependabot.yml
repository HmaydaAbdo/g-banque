# Mises à jour automatiques groupées : une PR par écosystème et par semaine (revue + CI avant merge)
version: 2
updates:
  - package-ecosystem: maven
    directory: /Backend
    schedule: { interval: weekly }
    groups:
      maven-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /Frontend
    schedule: { interval: weekly }
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /Backend
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /Frontend
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
