server:
  servlet:
    contextPath: /gBanque/api

spring:
  application:
    name: gBanque

  datasource:
    url: jdbc:mysql://localhost:3306/GBanque?useSSL=false&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  batch:
    job:
      enabled: true
    initialize-schema: always


functional:
  line:
    expiration:
      alert:
        threshold:
          months: 2
      warning:
        threshold:
          months: 3
