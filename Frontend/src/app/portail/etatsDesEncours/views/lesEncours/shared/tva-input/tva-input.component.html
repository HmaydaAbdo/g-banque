<span class="p-float-label">
  <p-dropdown [inputId]="inputId + 'Mode'"
              [options]="options"
              [ngModel]="mode"
              [ngModelOptions]="{standalone: true}"
              (ngModelChange)="onModeChange($event)"
              (onBlur)="onBlur()"
              [disabled]="disabled"
              optionLabel="label" optionValue="value"
              placeholder="Sélectionner un taux" appendTo="body"></p-dropdown>
  <label [for]="inputId + 'Mode'">{{ label }}</label>
</span>

@if (estSaisieLibre) {
  <span class="p-float-label mt-3 block">
    <p-inputNumber [inputId]="inputId + 'Montant'"
                   [ngModel]="montant"
                   [ngModelOptions]="{standalone: true}"
                   (ngModelChange)="onMontantChange($event)"
                   (onBlur)="onBlur()"
                   [disabled]="disabled"
                   mode="decimal" locale="fr-FR"
                   [minFractionDigits]="2" [maxFractionDigits]="2"
                   [min]="0" [max]="montantMax ?? undefined"
                   suffix=" MAD"></p-inputNumber>
    <label [for]="inputId + 'Montant'">Montant de {{ label }}</label>
  </span>
}
