server:
  servlet:
    contextPath: /gBanque/api

spring:
  application:
    name: gBanque
  profiles:
    active: dev

functional:
  line:
    expiration:
      alert:
        threshold:
          months: 2
      warning:
        threshold:
          months: 3

logging:
  level:
    org.springframework: WARN
    org.hibernate.SQL: WARN
