<div class=" w-full min-h-6rem ">

  <!-- Loading state -->
  <div *ngIf="loading" class="p-text-center p-text-secondary" style="width: 100%;">
    Chargement...
  </div>

  <div *ngIf="!loading && bankInfo" class="w-full flex flex-row justify-content-between font-bold  shadow-2 px-4">

    <div class="flex-shrink-0">
      <p class="  text-center text-xl" > La Banque  : <span class="text-blue-700">{{bankInfo.name}} </span></p>
    </div>

    <div class="flex-shrink-0">
      <p class="text-center text-xl">
        Solde actuelle :
        <span class="font-bold" [ngClass]="{'text-green-700': bankInfo.soldeActuelle >= 0, 'text-red-500': bankInfo.soldeActuelle < 0}">
      {{bankInfo.soldeActuelle | number: '1.2-2'}}
    </span> MAD
      </p>
    </div>


    @if (bankInfo.plafondFC) {
      <div  class="flex-shrink-0">
        <p class="text-center text-xl" > Facilité de caisse : <span class="font-bold text-green-700">
          {{bankInfo.plafondFC | number: '1.2-2'}} </span> MAD
        </p>
      </div>
    } @else {
      <div  class="flex-shrink-0">
        <p class="text-center " > Cette banque ne dispose pas de facilité de caisse </p>
      </div>
    }



  </div>

</div>
