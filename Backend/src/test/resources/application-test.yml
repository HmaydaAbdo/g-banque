# Profil TEST — seule surcharge de la configuration unique (application.yml) pour les tests d'intégration.
# Le schéma est construit par Flyway (V1, V2, R__) et validé par Hibernate, exactement comme en production :
# un écart entre les entités et les migrations fait échouer la suite. Seuls les jobs planifiés sont coupés.
spring:
  batch:
    job:
      enabled: false
functional:
  line:
    job:
      general:
        enabled: false
      specific:
        enabled: false
    jobs:
      enabled: false
leasing:
  main-levee:
    job:
      enabled: false
cmt:
  main-levee:
    job:
      enabled: false
