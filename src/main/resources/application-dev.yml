# =============================================================================
# G-Banque — Profil DEV
# Activé quand SPRING_PROFILES_ACTIVE=dev
# =============================================================================

management:
  endpoints:
    web:
      exposure:
        # Tous les endpoints Actuator disponibles en développement
        include: health,info,metrics,prometheus,loggers,env,threaddump,heapdump,scheduledtasks,liquibase,flyway

  endpoint:
    health:
      show-details: always

spring:
  jpa:
    hibernate:
      ddl-auto: update

    show-sql: false

  batch:
    jdbc:
      initialize-schema: always

logging:
  level:
    root: INFO
    staport.finance.gBanque: DEBUG
    org.springframework.web: INFO

    # SQL (à activer uniquement si besoin)
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE