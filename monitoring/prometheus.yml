global:
  scrape_interval: 15s       # Collecte les métriques toutes les 15 secondes
  evaluation_interval: 15s   # Évalue les règles d'alerte toutes les 15 secondes

scrape_configs:

  # ---------------------------------------------------------------------------
  # Spring Boot Backend — métriques Micrometer exposées via Actuator
  # Endpoint : http://backend:8080/gBanque/api/actuator/prometheus
  # ---------------------------------------------------------------------------
  - job_name: 'gbanque-backend'
    metrics_path: '/gBanque/api/actuator/prometheus'
    static_configs:
      - targets: ['backend:8080']
    scrape_interval: 15s

  # ---------------------------------------------------------------------------
  # Prometheus lui-même (métriques internes)
  # ---------------------------------------------------------------------------
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
