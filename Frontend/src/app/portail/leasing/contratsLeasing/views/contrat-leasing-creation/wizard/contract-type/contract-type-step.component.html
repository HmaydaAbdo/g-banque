<div class="p-fluid ">
  <div [formGroup]="formGroup" class="flex  flex-wrap gap-4 justify-content-center align-items-center p-4">
    <div class="field flex flex-column gap-4">
      <label for="typeContrat" class="text-center font-semibold ">Type de Contrat <span class="p-error">*</span></label>
      <p-dropdown
        id="typeContrat"
        [options]="contractTypes"
        optionLabel="label"
        optionValue="value"
        placeholder="Sélectionnez le type de contrat"
        formControlName="typeContrat"
        [ngClass]="{'ng-invalid ng-dirty': typeContratControl.invalid && (typeContratControl.dirty || typeContratControl.touched)}"
      ></p-dropdown>
      @if (typeContratControl.invalid && (typeContratControl.dirty || typeContratControl.touched)) {
        <div class="p-error">
          @if (typeContratControl.errors?.['required']) {
            <p-message severity="error" text="Le type de contrat est requis."></p-message>
          }
        </div>
      }
    </div>

  </div>
</div>
