<p-toast position="center"></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="card flex flex-column gap-2 p-2  w-full h-full overflow-y-scroll ">

  <div class=" portail-section flex fex-wrap justify-content-between  align-items-center">
    <h3 >Liste des Organismes de Leasing</h3>
    <div class="flex gap-2">
      <p-button label="Exporter PDF" icon="pi pi-file-pdf" severity="danger" [outlined]="true" [loading]="exporting" (click)="exportPdf()" />
      <p-button label="Nouveau Organisme de Leasing" icon="pi pi-plus" severity="primary" (click)="openNewOrganismeLeasingPage()" />
    </div>
  </div>

  <div class="p-fluid grid ">
    <div class="field col-12 md:col-4">
      <div class="pg-filters">
  <span class="pg-filters__label"><i class="pi pi-sliders-h" aria-hidden="true"></i> Filtres</span>
  <form [formGroup]="searchForm">
        <span class="p-input-icon-left">
          <i class="pi pi-search"></i>
          <input pInputText type="text" formControlName="nom" placeholder="Rechercher par Nom" />
        </span>
      </form>
</div>
    </div>

  </div>

  <div class="pb-8">
    <p-table
    #dt
    [value]="organismeLeasings"
    [lazy]="true" [sortField]="'id'" [sortOrder]="-1"
    (onLazyLoad)="loadOrganismeLeasings($event)"
    [paginator]="true"
    [rows]="10"
    [totalRecords]="totalRecords"
    [loading]="loading"
    [globalFilterFields]="['nom', 'id']"
    [rowsPerPageOptions]="[3,5, 10, 25, 50]"
    [rowHover]="true"
    dataKey="id"
    currentPageReportTemplate="Affichage de {first} à {last} sur {totalRecords} organismes"
    [showCurrentPageReport]="true"
    [filterDelay]="0"
    columnResizeMode="expand"
    responsiveLayout="scroll"
    [scrollable]="true"
    styleClass="p-datatable-gridlines text-xs"
    >
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="id" style="width: 5rem;">ID <p-sortIcon field="id"></p-sortIcon></th>
        <th pSortableColumn="nom">Nom <p-sortIcon field="nom"></p-sortIcon></th>
        <th style="width: 12rem;">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-organisme>
      <tr>
        <td>{{ organisme.id }}</td>
        <td>{{ organisme.nom }}</td>
        <td class="flex flex-row gap-2">
          <button pButton pRipple icon="pi pi-file-edit" class="p-button-rounded p-button-outlined p-button-info"
                  (click)="viewContratsCadres(organisme.id)" pTooltip="Contrats cadres" tooltipPosition="top"></button>
          <button pButton pRipple icon="pi pi-pencil" class="p-button-rounded p-button-outlined p-button-success"
                  (click)="editOrganismeLeasing(organisme)" pTooltip="Modifier" tooltipPosition="top"></button>
          @if (isSystemAdmin()) {
            <button pButton pRipple icon="pi pi-trash" class="p-button-rounded p-button-outlined p-button-danger"
                    (click)="confirmDeleteOrganismeLeasing(organisme.id, organisme.nom)" pTooltip="Supprimer" tooltipPosition="top"></button>
          }
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3" class="text-center">Aucun organisme de leasing trouvé.</td>
      </tr>
    </ng-template>
    <ng-template pTemplate="loadingbody">
      <tr>
        <td colspan="3" class="text-center">Chargement des organismes de leasing. Veuillez patienter...</td>
      </tr>
    </ng-template>
  </p-table>
  </div>

</div>
