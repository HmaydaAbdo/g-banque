<div class="w-screen flex justify-content-between p-1 border-bottom-3 surface-border text-xs">

  <div class="flex align-items-center">
    <img src="assets/staportLogo.png" alt="Your Logo" class="block mx-auto" style="height: 2rem; width: 6.52rem;" />
  </div>

  <div>
    <nav class="hidden lg:flex align-items-center">
      <ul class="list-none flex justify-content-between p-0 m-0">
        <li *ngFor="let item of filteredMenuItems">
          <a pRipple [routerLink]="item.routerLink" routerLinkActive="active-nav-link"
             class="flex align-items-center nav-link hover:bg-blue-50 border-round-xl p-3">
            <span [class]="item.icon"></span>
            <span class="ml-2 nav-label">{{ item.label }}</span>
          </a>
        </li>
      </ul>
    </nav>
  </div>

  <div class="flex gap-3 align-items-center">

    <div class="relative inline-flex align-items-center justify-content-center
              w-3rem h-3rem border border-round surface-border
              text-blue-500 hover:bg-blue-50 cursor-pointer" (click)="openSidebar.emit()">
      <i class="pi pi-bars text-2xl"  pTooltip="Ouvrir le menu de navigation principale" tooltipPosition="bottom"></i>
    </div>

    <!-- Notification Bell Icon with Badge -->
    <div class="relative inline-flex align-items-center justify-content-center
              w-3rem h-3rem border border-round surface-border
              text-blue-500 hover:bg-blue-50 cursor-pointer p-overlay-badge" (click)="showNotificationDialog()">
      <i class="pi pi-bell text-xl" pTooltip="Notifications" tooltipPosition="bottom"></i>
      <!-- Display unreadCount, hide if 0 -->
      <p-badge *ngIf="unreadCount > 0" [value]="unreadCount" severity="danger" styleClass="mt-2 p-0"></p-badge>
    </div>

    <div class="relative inline-flex align-items-center justify-content-center
              w-3rem h-3rem border border-round border-red-300
              text-red-500 hover:bg-red-50 cursor-pointer" (click)="confirmLogout($event)">
      <i class="pi pi-power-off text-2xl" [class.p-button-loading]="loading"  pTooltip="Se déconnecter de votre compte" tooltipPosition="bottom"></i>
    </div>

  </div>

</div>

<!-- Dialog for Notifications -->
<p-dialog
  header="Notifications"
  [(visible)]="notificationDialogVisible"
  [modal]="true"
  [style]="{width: '800px'}"
  [draggable]="false"
  [resizable]="false"
  [dismissableMask]="true">
  <ng-template pTemplate="content">
    <app-notification-list
      [notificationService]="notificationService"
      (notificationMarkedAsRead)="notificationDialogVisible = false"
    ></app-notification-list>
  </ng-template>
</p-dialog>

<p-confirmDialog header="Confirmer la déconnexion" icon="pi pi-exclamation-triangle"></p-confirmDialog>
<p-toast></p-toast>
